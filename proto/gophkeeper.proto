// Контракт публичного API GophKeeper по gRPC.
// Смысл полей совпадает с доменными моделями в internal/model.
syntax = "proto3";

package gophkeeper.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/coolycow/gophkeeper/internal/proto/gophkeeperpb;gophkeeperpb";

// -----------------------------------------------------------------------------
// Сервис: один вход для CLI и других клиентов.
// Вызовы, кроме Register, Login, Ping, RefreshToken, требуют метаданных авторизации
// (например заголовок "authorization: Bearer <JWT access>") — JWT подписан HS256 на сервере.
// -----------------------------------------------------------------------------

service GophKeeperService {
  // Проверка доступности сервера (без авторизации).
  rpc Ping(PingRequest) returns (PingResponse);

  // Регистрация нового пользователя (без авторизации).
  rpc Register(RegisterRequest) returns (AuthResponse);

  // Вход по email и паролю (без авторизации).
  rpc Login(LoginRequest) returns (AuthResponse);

  // Обновление пары access/refresh по refresh-токену (без access-токена в заголовке).
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);

  // -----------------------------------------------------------------------------
  // Список секретов пользователя — для обзора и синхронизации (какие есть id и текущая версия).
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // Получить секрет с текущей версией (и при необходимости историей версий).
  rpc GetSecret(GetSecretRequest) returns (Secret);

  // Создать новый секрет (первая версия ciphertext задаётся клиентом).
  rpc CreateSecret(CreateSecretRequest) returns (Secret);

  // Добавить новую версию секрета (данные снова шифрует клиент).
  rpc UpdateSecret(UpdateSecretRequest) returns (SecretVersion);

  // Удалить секрет (логика «мягкое/жёсткое» — на усмотрение реализации сервера).
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  // -----------------------------------------------------------------------------
  // История версий одного секрета (для отката и синхронизации).
  rpc ListSecretVersions(ListSecretVersionsRequest) returns (ListSecretVersionsResponse);

  // Одна конкретная версия (если нужна без полного GetSecret).
  rpc GetSecretVersion(GetSecretVersionRequest) returns (SecretVersion);

  // Удалить версию секрета (только жёсткое удаление).
  rpc DeleteSecretVersion(DeleteSecretVersionRequest) returns (DeleteSecretVersionResponse);

  // Восстановить версию секрета (устанавливает её текущей для секрета).
  rpc RestoreSecretVersion(RestoreSecretVersionRequest) returns (RestoreSecretVersionResponse);

  // -----------------------------------------------------------------------------
  // Вложения к версии секрета: список без тела файла.
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse);

  // Скачать одно вложение целиком (метаданные + ciphertext).
  rpc GetAttachment(GetAttachmentRequest) returns (Attachment);

  // Загрузить вложение к указанной версии секрета.
  rpc CreateAttachment(CreateAttachmentRequest) returns (Attachment);

  // Удалить вложение.
  rpc DeleteAttachment(DeleteAttachmentRequest) returns (DeleteAttachmentResponse);
}

// -----------------------------------------------------------------------------
// Общие типы
// -----------------------------------------------------------------------------

// Запрос Ping: пустое сообщение своего типа — при появлении параметров (например locale)
// добавляются новые поля с номерами, старые клиенты по правилам proto3 их игнорируют.
message PingRequest {}

// Ответ на Ping: можно расширять (версия сервера и т.д.).
message PingResponse {
  // Короткая строка, например "ok".
  string status = 1;
}

// Ответ на удаление секрета: пока без полей; при необходимости сюда добавляют, например,
// идентификатор асинхронной операции или время удаления — номера полей не пересекаются с «чужими» типами.
message DeleteSecretResponse {}

// Ответ на удаление вложения — отдельный тип для независимого расширения.
message DeleteAttachmentResponse {}

// -----------------------------------------------------------------------------
// Аутентификация
// -----------------------------------------------------------------------------

message RegisterRequest {
  // Email пользователя (уникален на сервере).
  string email = 1;
  string password = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshTokenRequest {
  // Refresh-токен, выданный ранее при Login/Register/Refresh.
  string refresh_token = 1;
}

// Ответ с токенами (как в model.AuthResponse).
message AuthResponse {
  string salt = 1;
  string token = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// -----------------------------------------------------------------------------
// Секреты
// -----------------------------------------------------------------------------

// Область выборки для ListSecrets: активные, только корзина (мягко удалённые) или все.
enum SecretListScope {
  SECRET_LIST_SCOPE_UNSPECIFIED = 0;
  SECRET_LIST_SCOPE_ACTIVE_ONLY = 1;
  SECRET_LIST_SCOPE_DELETED_ONLY = 2;
  SECRET_LIST_SCOPE_ALL = 3;
}

// Краткая информация о секрете для списков и синхронизации.
message SecretSummary {
  string id = 1;
  string current_secret_version_id = 2;
  google.protobuf.Timestamp updated_at = 3;
  // Для записей в корзине (мягкое удаление); для активных не задаётся.
  google.protobuf.Timestamp deleted_at = 4;
  // Название (ciphertext, тот же алгоритм, что data_encrypted); пусто для старых данных.
  bytes title_encrypted = 5;
  // Время создания записи секрета.
  google.protobuf.Timestamp created_at = 6;
}

message ListSecretsRequest {
  SecretListScope list_scope = 1;
}

message ListSecretsResponse {
  repeated SecretSummary secrets = 1;
}

message GetSecretRequest {
  string secret_id = 1;
  bool include_version_history = 2;
}

// Полный секрет: метаданные + текущая версия и опционально история.
message Secret {
  string id = 1;
  string user_id = 2;
  string current_secret_version_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
  SecretVersion current_version = 7;
  repeated SecretVersion secret_versions = 8;
}

message SecretVersion {
  string id = 1;
  string secret_id = 2;
  int32 version = 3;
  int32 data_format_version = 4;
  bytes data_encrypted = 5;
  int32 data_size = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp deleted_at = 9;
  // Название в списке (ciphertext); пусто для старых версий.
  bytes title_encrypted = 10;
}

message CreateSecretRequest {
  bytes data_encrypted = 1;
  int32 data_format_version = 2;
  bytes title_encrypted = 3;
}

message UpdateSecretRequest {
  string secret_id = 1;
  bytes data_encrypted = 2;
  int32 data_format_version = 3;
  bytes title_encrypted = 4;
}

message DeleteSecretRequest {
  string secret_id = 1;
}

message ListSecretVersionsRequest {
  string secret_id = 1;
}

message ListSecretVersionsResponse {
  repeated SecretVersion versions = 1;
}

message GetSecretVersionRequest {
  string secret_id = 1;
  string secret_version_id = 2;
}

message DeleteSecretVersionRequest {
  string secret_id = 1;
  string secret_version_id = 2;
}

message DeleteSecretVersionResponse {
  string secret_version_id = 1;
}

message RestoreSecretVersionRequest {
  string secret_id = 1;
  string secret_version_id = 2;
}

message RestoreSecretVersionResponse {
  string secret_version_id = 1;
}

// -----------------------------------------------------------------------------
// Вложения (файлы к версии секрета)
// -----------------------------------------------------------------------------

message AttachmentSummary {
  string id = 1;
  string secret_version_id = 2;
  int32 data_format_version = 3;
  int32 info_format_version = 4;
  bytes info_encrypted = 5;
  int32 info_size = 6;
  int32 data_size = 7;
  google.protobuf.Timestamp created_at = 8;
}

message Attachment {
  string id = 1;
  string secret_version_id = 2;
  int32 data_format_version = 3;
  int32 info_format_version = 4;
  bytes info_encrypted = 5;
  int32 info_size = 6;
  bytes data_encrypted = 7;
  int32 data_size = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListAttachmentsRequest {
  oneof scope {
    string secret_id = 1;
    string secret_version_id = 2;
  }
}

message ListAttachmentsResponse {
  repeated AttachmentSummary attachments = 1;
}

message GetAttachmentRequest {
  string attachment_id = 1;
}

message CreateAttachmentRequest {
  string secret_version_id = 1;
  int32 data_format_version = 2;
  int32 info_format_version = 3;
  bytes info_encrypted = 4;
  bytes data_encrypted = 5;
}

message DeleteAttachmentRequest {
  string attachment_id = 1;
}
